name: CoopBench
options:
  bundleIdPrefix: org.coopbench
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.11.12'
    CURRENT_PROJECT_VERSION: '1'
targets:
  CoopBench:
    type: application
    platform: iOS
    sources:
      - path: CoopBench
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.coopbench.ios
        INFOPLIST_FILE: CoopBench/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [CoopBenchTests]
  CoopBenchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CoopBench
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
