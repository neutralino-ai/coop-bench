# Standalone nginx instance. Never include /etc/nginx/nginx.conf or other sites.
user www-data;
worker_processes 2;
pid /run/coop-bench-api-proxy/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    default_type application/json;
    server_tokens off;
    log_format api_security escape=json '{"time":"$time_iso8601","remote":"$remote_addr","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log syslog:server=unix:/run/systemd/journal/dev-log,tag=coop_bench_api_proxy,nohostname api_security;
    client_body_temp_path /run/coop-bench-api-proxy/body;
    proxy_temp_path /run/coop-bench-api-proxy/proxy;
    fastcgi_temp_path /run/coop-bench-api-proxy/fastcgi;
    uwsgi_temp_path /run/coop-bench-api-proxy/uwsgi;
    scgi_temp_path /run/coop-bench-api-proxy/scgi;
    limit_req_zone $binary_remote_addr zone=api34935_requests:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=api34935_connections:10m;
    map "$request_method:$uri" $api_route_allowed {
        default 0;
        ~^GET:/api/v1/auth/(status|account)$ 1;
        ~^POST:/api/v1/auth/(login|password|logout)$ 1;
        ~^GET:/api/v1/(health|identity|games(/[A-Za-z0-9_-]+)?|rollouts(/[A-Za-z0-9_-]+(/messages|/artifacts(/[A-Za-z0-9_-]+/content)?)?)?|episodes/[A-Za-z0-9_-]+/(observation|audit|training|replay|messages|artifacts(/[A-Za-z0-9_-]+/content)?))$ 1;
        ~^POST:/api/v1/(episodes(/[A-Za-z0-9_-]+/(actions|reflections|truncate|messages(/complete)?|artifacts(/[A-Za-z0-9_-]+/(chunks|complete))?))?|rollouts/[A-Za-z0-9_-]+/annotations)$ 1;
    }
    # Check the unnormalized path too: aliases, % encoding and dot segments
    # must not normalize into allowed routes on the old web-enabled backend.
    map $request_uri $api_raw_path_allowed {
        default 0;
        ~^/api/v1/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*([?].*)?$ 1;
    }

    # The existing certbot lineage uses this webroot for HTTP-01 renewal.
    # Port 80 serves public challenge files only, with no application proxy.
    server {
        listen 80;
        server_name coop.neutrinophysics.cn;
        if ($host != coop.neutrinophysics.cn) { return 421; }
        client_max_body_size 1k;
        client_header_timeout 5s;
        client_body_timeout 5s;
        keepalive_timeout 5s;
        location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
            root /var/lib/letsencrypt;
            default_type text/plain;
            try_files $uri =404;
            limit_except GET { deny all; }
        }
        location / { return 404; }
    }

    server {
        listen 34935 ssl;
        server_name coop.neutrinophysics.cn;
        if ($http_host != coop.neutrinophysics.cn:34935) { return 421; }
        if ($ssl_server_name != coop.neutrinophysics.cn) { return 421; }
        # This is a native desktop/agent endpoint; no browser CORS entry exists.
        # Validate before proxying, never hide an arbitrary browser Origin.
        if ($http_origin != "") { return 403; }
        if ($api_raw_path_allowed = 0) { return 404; }
        if ($api_route_allowed = 0) { return 404; }
        ssl_certificate /etc/letsencrypt/live/coop.neutrinophysics.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/coop.neutrinophysics.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:api34935_tls:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        auth_basic off;
        client_max_body_size 64k;
        client_body_timeout 15s;
        client_header_timeout 5s;
        keepalive_timeout 30s;
        send_timeout 30s;
        large_client_header_buffers 2 8k;
        limit_conn api34935_connections 20;
        limit_conn_status 429;
        limit_req_status 429;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        location / {
            limit_req zone=api34935_requests burst=30 nodelay;
            proxy_pass http://127.0.0.1:8788;
            proxy_http_version 1.1;
            # The deployed backend pins a portless internal proxy Host. Public
            # authority was checked above; this never trusts a forwarded Host.
            proxy_set_header Host coop.neutrinophysics.cn;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Tailscale-User-Login "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_next_upstream off;
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_max_temp_file_size 0;
        }
    }
}
