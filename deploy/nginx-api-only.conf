# Example LOCATION FRAGMENT, not a complete nginx site.
# Replace the existing catch-all proxy location inside the existing HTTPS
# server {} with this fragment. Preserve TLS, Host/SNI checks, rate-limit zones,
# body/time limits, logging, and the separate HTTP ACME challenge configuration.
# Do not include this file alongside an existing `location /` in that server.
# Uses the existing coop_requests rate-limit zone and loopback upstream.

# Protect the currently deployed web-enabled binary too. Its router strips
# /api/v1 before routing, so a prefix-only proxy otherwise exposes these pages.
# Keep the general API prefix below WITHOUT ^~, so this deny regex takes effect.
location ~ ^/api/v1/(?:play|app\.js|style\.css|play\.js|play\.css|transport\.js)?$ {
    return 404;
}
location = /api/v1 { return 404; }

location /api/v1/ {
    limit_req zone=coop_requests burst=30 nodelay;
    # No trailing slash: preserve /api/v1 in the upstream request.
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Tailscale-User-Login "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_max_temp_file_size 0;
}

location = /health {
    limit_req zone=coop_requests burst=30 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Tailscale-User-Login "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_max_temp_file_size 0;
}

location / { return 404; }
