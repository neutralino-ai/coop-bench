# Independent instance: no global nginx include and no port 80/443 ownership.
user www-data;
worker_processes 1;
pid /run/coop-bench-v09-proxy/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    default_type application/json;
    server_tokens off;
    log_format api_security escape=json '{"time":"$time_iso8601","remote":"$remote_addr","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log syslog:server=unix:/run/systemd/journal/dev-log,tag=coop_bench_v09_proxy,nohostname api_security;
    client_body_temp_path /run/coop-bench-v09-proxy/body;
    proxy_temp_path /run/coop-bench-v09-proxy/proxy;
    fastcgi_temp_path /run/coop-bench-v09-proxy/fastcgi;
    uwsgi_temp_path /run/coop-bench-v09-proxy/uwsgi;
    scgi_temp_path /run/coop-bench-v09-proxy/scgi;
    limit_req_zone $binary_remote_addr zone=api34936_requests:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=api34936_connections:10m;
    map "$request_method:$uri" $api_route_allowed {
        default 0;
        ~^GET:/api/v1/auth/(status|account)$ 1;
        ~^POST:/api/v1/auth/(login|password|logout)$ 1;
        ~^GET:/api/v1/(health|identity|games(/[A-Za-z0-9_-]+)?|rooms(/[A-Za-z0-9_-]+(/admin)?)?|rollouts(/[A-Za-z0-9_-]+(/messages|/artifacts(/[A-Za-z0-9_-]+/content)?)?)?|episodes/[A-Za-z0-9_-]+/(rules|wait|events|observation|audit|training|replay|messages|artifacts(/[A-Za-z0-9_-]+/content)?))$ 1;
        ~^POST:/api/v1/(rooms(/[A-Za-z0-9_-]+/(join|ready|leave|(admin-)?(start|invite|kick)))?|episodes(/[A-Za-z0-9_-]+/(actions|reflections|truncate|messages(/complete)?|artifacts(/[A-Za-z0-9_-]+/(chunks|complete))?))?|rollouts/[A-Za-z0-9_-]+/annotations)$ 1;
    }
    map $request_uri $api_raw_path_allowed {
        default 0;
        ~^/api/v1/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*([?].*)?$ 1;
    }
    # Proxy-generated throttles also expose a bounded retry hint.
    map $status $retry_after { default ""; 429 5; }
    map $upstream_http_retry_after $response_retry_after {
        default $upstream_http_retry_after;
        "" $retry_after;
    }
    server {
        listen 34936 ssl;
        server_name coop.neutrinophysics.cn;
        if ($http_host != coop.neutrinophysics.cn:34936) { return 421; }
        if ($ssl_server_name != coop.neutrinophysics.cn) { return 421; }
        if ($http_origin != "") { return 403; }
        if ($api_raw_path_allowed = 0) { return 404; }
        if ($api_route_allowed = 0) { return 404; }
        ssl_certificate /etc/letsencrypt/live/coop.neutrinophysics.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/coop.neutrinophysics.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:api34936_tls:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        auth_basic off;
        client_max_body_size 64k;
        client_body_timeout 15s;
        client_header_timeout 5s;
        keepalive_timeout 30s;
        send_timeout 65s;
        large_client_header_buffers 2 8k;
        limit_conn api34936_connections 20;
        limit_conn_status 429;
        limit_req_status 429;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Retry-After $response_retry_after always;
        location / {
            limit_req zone=api34936_requests burst=30 nodelay;
            proxy_pass http://127.0.0.1:8789;
            proxy_http_version 1.1;
            proxy_set_header Host coop.neutrinophysics.cn;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Tailscale-User-Login "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            # Long-poll permits 50 seconds; SSE sends heartbeats. Do not buffer.
            proxy_read_timeout 65s;
            proxy_next_upstream off;
            proxy_hide_header Retry-After;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
        }
    }
}
