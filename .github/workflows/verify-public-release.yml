name: Verify public release downloads
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to check with the older updater
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Check public discovery, real installer download and hashes
        run: node scripts/verify-public-release.mjs artifacts/public-release-verification "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: public-release-verification
          path: artifacts/public-release-verification/verification.json
          if-no-files-found: error
