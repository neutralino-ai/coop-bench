name: iOS client
on:
  workflow_dispatch:
  push:
    branches: [main, codex/ios-client]
    paths: ['ios/**', 'web/**', 'scripts/*ios*', 'desktop/mock-api.mjs', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['ios/**', 'web/**', 'scripts/*ios*', 'desktop/mock-api.mjs', '.github/workflows/ios-build.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare native project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          node scripts/build-ios.mjs
          xcodegen generate --spec ios/project.yml
          xcodebuild -version
          mkdir -p artifacts/ios
          xcrun simctl list devices available -j > artifacts/ios/devices.json
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const list=JSON.parse(readFileSync('artifacts/ios/devices.json'));
          const phone=Object.values(list.devices).flat().find(d=>d.isAvailable&&d.name.startsWith('iPhone'));
          if(!phone)throw Error('No available iPhone simulator');
          appendFileSync(process.env.GITHUB_ENV,'IOS_DEVICE='+phone.udid+'\n');
          NODE
      - name: Build and test on iPhone simulator
        run: |
          xcrun simctl boot "$IOS_DEVICE"
          xcrun simctl bootstatus "$IOS_DEVICE" -b
          set -o pipefail
          xcodebuild test -project ios/CoopBench.xcodeproj -scheme CoopBench -destination "platform=iOS Simulator,id=$IOS_DEVICE" -derivedDataPath artifacts/ios-derived -resultBundlePath artifacts/ios/UnitTests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/ios/build.log
      - name: Verify iPhone login, human seat and model harness
        run: |
          node scripts/ios-smoke-api.mjs > artifacts/ios/fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do [ -f artifacts/ios/launch.txt ] && break; sleep 1; done
          xcrun simctl install "$IOS_DEVICE" artifacts/ios-derived/Build/Products/Debug-iphonesimulator/CoopBench.app
          xcrun simctl launch --terminate-running-process "$IOS_DEVICE" org.coopbench.ios --smoke "$(cat artifacts/ios/launch.txt)"
          container=$(xcrun simctl get_app_container "$IOS_DEVICE" org.coopbench.ios data)
          for i in {1..100}; do [ -f "$container/Documents/ios-smoke.json" ] && break; sleep 1; done
          xcrun simctl io "$IOS_DEVICE" screenshot artifacts/ios/player.png
          cp "$container/Documents/ios-smoke.json" artifacts/ios/ios-smoke.json
          node --input-type=module -e 'import fs from "node:fs";const r=JSON.parse(fs.readFileSync("artifacts/ios/ios-smoke.json"));console.log(r);if(!r.ok)process.exit(1)'
      - name: Compile for physical iPhone without signing
        run: |
          set -o pipefail
          xcodebuild build -project ios/CoopBench.xcodeproj -scheme CoopBench -configuration Release -destination 'generic/platform=iOS' -derivedDataPath artifacts/ios-device CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/ios/device-build.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-simulator-evidence
          path: |
            artifacts/ios/*.json
            artifacts/ios/*.log
            artifacts/ios/*.png
            artifacts/ios/UnitTests.xcresult
          retention-days: 14
