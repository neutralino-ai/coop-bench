name: Desktop build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL concurrency and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: coop_test
          POSTGRES_PASSWORD: isolated-ci-fixture-only
          POSTGRES_DB: coop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coop_test -d coop_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COOP_TEST_DATABASE_URL: postgresql://coop_test:isolated-ci-fixture-only@127.0.0.1:5432/coop_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: node --test test/postgres*.test.ts
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            artifact: windows-x64
            build-args: --win nsis --x64
            executable: release/win-unpacked/Coop Bench.exe
            player-executable: release-player/win-unpacked/Coop Bench Player.exe
            arch: x64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
            build-args: --mac dmg zip --x64
            executable: release/mac/Coop Bench.app/Contents/MacOS/Coop Bench
            player-executable: release-player/mac/Coop Bench Player.app/Contents/MacOS/Coop Bench Player
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
            build-args: --mac dmg zip --arm64
            executable: release/mac-arm64/Coop Bench.app/Contents/MacOS/Coop Bench
            player-executable: release-player/mac-arm64/Coop Bench Player.app/Contents/MacOS/Coop Bench Player
            arch: arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Node must be installed before pnpm on Intel macOS.
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
          run_install: false
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test engines and interfaces
        run: pnpm test
      - name: Build self-contained runtime
        run: pnpm build
      - name: Exercise desktop with isolated synthetic data
        timeout-minutes: 3
        run: pnpm exec electron . --client-smoke-test --data-dir=artifacts/ci-client-smoke
      - name: Require successful desktop acceptance report
        run: node -e "const r=require('./artifacts/ci-client-smoke/client-smoke-result.json');if(!r.ok)throw Error('Desktop smoke failed');console.log(r.checks.length+' desktop checks passed')"
      - name: Package unsigned test installers
        run: pnpm exec electron-builder --config build/electron-builder.json ${{ matrix.build-args }} --publish never
      - name: Verify the actual packaged desktop application
        timeout-minutes: 3
        run: node desktop/ci-client-smoke.mjs "${{ matrix.executable }}" artifacts/ci-packaged-smoke "${{ matrix.arch }}"
      - name: Package the separate player client
        run: pnpm exec electron-builder --config build/player-electron-builder.json ${{ matrix.build-args }} --publish never
      - name: Verify the packaged player client with an isolated local server
        timeout-minutes: 3
        run: node desktop/ci-player-smoke.mjs "${{ matrix.player-executable }}" artifacts/ci-player-smoke "${{ matrix.arch }}"
      - name: Upload installers and build identity
        uses: actions/upload-artifact@v6
        with:
          name: coop-bench-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release-player/*.exe
            release-player/*.dmg
            release-player/*.zip
            runtime/coop-bench/build-manifest.json
      # Never upload the fixture database, generated credentials, or userData.
      - name: Upload synthetic UI acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: synthetic-ui-${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/ci-client-smoke/client-smoke-result.json
            artifacts/ci-client-smoke/client-connection-*.png
            artifacts/ci-client-smoke/client-audit.png
            artifacts/ci-client-smoke/replay-*.png
            artifacts/ci-client-smoke/replay-layout.json
            artifacts/ci-packaged-smoke/client-smoke-result.json
            artifacts/ci-packaged-smoke/client-connection-*.png
            artifacts/ci-packaged-smoke/client-settings-password.png
            artifacts/ci-packaged-smoke/replay-*.png
            artifacts/ci-packaged-smoke/replay-layout.json
            artifacts/ci-packaged-smoke/client-game-rules.png
            artifacts/ci-packaged-smoke/client-update-ready.png
            artifacts/ci-player-smoke/player-smoke-result.json
            artifacts/ci-player-smoke/player-hanabi.png

  publish:
    name: Publish verified installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, postgres]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          pattern: coop-bench-*
          path: dist
          merge-multiple: true
      - name: Verify version and required native installers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const version=JSON.parse(readFileSync('package.json')).version;
          if(process.env.GITHUB_REF_NAME!=='v'+version)throw Error('Tag/package version mismatch');
          const names=['win-x64.exe','mac-x64.dmg','mac-arm64.dmg'].map(s=>'Coop-Bench-'+version+'-'+s);
          for(const n of names)if(!existsSync('dist/release/'+n))throw Error('Missing installer: '+n);
          const playerNames=['win-x64.exe','mac-x64.dmg','mac-arm64.dmg'].map(s=>'Coop-Bench-Player-'+version+'-'+s);
          for(const n of playerNames)if(!existsSync('dist/release-player/'+n))throw Error('Missing player installer: '+n);
          writeFileSync('dist/release/SHA256SUMS.txt',[...names.map(n=>['release',n]),...playerNames.map(n=>['release-player',n])].map(([dir,n])=>createHash('sha256').update(readFileSync('dist/'+dir+'/'+n)).digest('hex')+'  '+n).join('\n')+'\n');
          NODE
      - name: Publish GitHub Release after all three packaged apps pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/*.exe dist/release/*.dmg dist/release/*.zip dist/release-player/*.exe dist/release-player/*.dmg dist/release-player/*.zip dist/release/SHA256SUMS.txt --verify-tag --title "Coop Bench ${GITHUB_REF_NAME#v}" --notes-file "docs/release-${GITHUB_REF_NAME#v}.md"
