name: Remote clients

on:
  workflow_dispatch:
    inputs:
      apple_signing:
        description: Sign and notarize macOS, and upload iOS to TestFlight
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: clients-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  desktop:
    needs: quality
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            artifact: windows-x64
            build-args: --win nsis --x64
            executable: release/win-unpacked/Coop Bench.exe
            player-executable: release-player/win-unpacked/Coop Bench Player.exe
            asar: release/win-unpacked/resources/app.asar
            player-asar: release-player/win-unpacked/resources/app.asar
            arch: x64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
            build-args: --mac dmg zip --x64
            executable: release/mac/Coop Bench.app/Contents/MacOS/Coop Bench
            player-executable: release-player/mac/Coop Bench Player.app/Contents/MacOS/Coop Bench Player
            asar: release/mac/Coop Bench.app/Contents/Resources/app.asar
            player-asar: release-player/mac/Coop Bench Player.app/Contents/Resources/app.asar
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
            build-args: --mac dmg zip --arm64
            executable: release/mac-arm64/Coop Bench.app/Contents/MacOS/Coop Bench
            player-executable: release-player/mac-arm64/Coop Bench Player.app/Contents/MacOS/Coop Bench Player
            asar: release/mac-arm64/Coop Bench.app/Contents/Resources/app.asar
            player-asar: release-player/mac-arm64/Coop Bench Player.app/Contents/Resources/app.asar
            arch: arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SIGN_APPLE: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || inputs.apple_signing == true) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
          run_install: false
          cache: true
      - name: Install locked client dependencies
        run: pnpm install --frozen-lockfile
      - name: Client unit and public-boundary tests
        run: pnpm test
      - name: Build remote-only client runtime
        run: pnpm build
      - name: Exercise desktop against synthetic mock API
        timeout-minutes: 5
        run: pnpm exec electron . --client-smoke-test --data-dir=artifacts/ci-client-smoke
      - name: Require client acceptance report
        run: node -e "const r=require('./artifacts/ci-client-smoke/client-smoke-result.json');if(!r.ok)throw Error('Client smoke failed');console.log(r.checks.length+' mock API/UI checks passed')"
      - name: Verify Take Time human controls and recorded board
        timeout-minutes: 3
        run: pnpm exec electron scripts/test-take-time-ui.cjs
      - name: Require Take Time rendering report
        run: node -e "if(!require('./artifacts/take-time-ui/result.json').passed)throw Error('Take Time UI failed')"
      - name: Package management client
        if: runner.os != 'macOS' || env.SIGN_APPLE != 'true'
        run: pnpm exec electron-builder --config build/electron-builder.json ${{ matrix.build-args }} --publish never
      - name: Sign and notarize management client
        if: runner.os == 'macOS' && env.SIGN_APPLE == 'true'
        env:
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/package-desktop.mjs management ${{ matrix.build-args }}
      - name: Audit management package file boundary
        run: node scripts/verify-package.mjs "${{ matrix.asar }}"
      - name: Verify actual packaged management client with mock API
        if: runner.os != 'macOS'
        timeout-minutes: 5
        run: node desktop/ci-client-smoke.mjs "${{ matrix.executable }}" artifacts/ci-packaged-smoke "${{ matrix.arch }}"
      - name: Verify actual packaged macOS client with isolated test keychain
        if: runner.os == 'macOS'
        timeout-minutes: 6
        run: node scripts/with-mac-test-keychain.mjs desktop/ci-client-smoke.mjs "${{ matrix.executable }}" artifacts/ci-packaged-smoke "${{ matrix.arch }}"
      - name: Package Player client
        if: runner.os != 'macOS' || env.SIGN_APPLE != 'true'
        run: pnpm exec electron-builder --config build/player-electron-builder.json ${{ matrix.build-args }} --publish never
      - name: Sign and notarize Player client
        if: runner.os == 'macOS' && env.SIGN_APPLE == 'true'
        env:
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/package-desktop.mjs player ${{ matrix.build-args }}
      - name: Audit Player package file boundary
        run: node scripts/verify-package.mjs "${{ matrix.player-asar }}"
      - name: Verify actual packaged Player with mock API
        if: runner.os != 'macOS'
        timeout-minutes: 3
        run: node desktop/ci-player-smoke.mjs "${{ matrix.player-executable }}" artifacts/ci-player-smoke "${{ matrix.arch }}"
      - name: Verify actual packaged macOS Player with isolated test keychain
        if: runner.os == 'macOS'
        timeout-minutes: 4
        run: node scripts/with-mac-test-keychain.mjs desktop/ci-player-smoke.mjs "${{ matrix.player-executable }}" artifacts/ci-player-smoke "${{ matrix.arch }}"
      - name: Verify signatures and Gatekeeper on final macOS packages
        if: runner.os == 'macOS' && env.SIGN_APPLE == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/verify-mac-signing.mjs
      - name: Upload remote-only installers
        uses: actions/upload-artifact@v6
        with:
          name: coop-bench-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release-player/*.exe
            release-player/*.dmg
            release-player/*.zip
      - name: Upload Apple signing evidence
        if: always() && runner.os == 'macOS' && env.SIGN_APPLE == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: apple-signing-${{ matrix.artifact }}
          path: artifacts/apple-signing/*.json
          retention-days: 30
      - name: Upload synthetic client evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: synthetic-client-${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/ci-client-smoke/client-smoke-result.json
            artifacts/ci-client-smoke/*.png
            artifacts/ci-client-smoke/replay-layout.json
            artifacts/ci-packaged-smoke/client-smoke-result.json
            artifacts/ci-packaged-smoke/*.png
            artifacts/ci-packaged-smoke/replay-layout.json
            artifacts/ci-player-smoke/player-smoke-result.json
            artifacts/ci-player-smoke/*.png
            artifacts/take-time-ui/result.json
            artifacts/take-time-ui/*.png

  ios:
    needs: quality
    name: iOS native and simulator acceptance
    uses: ./.github/workflows/ios-build.yml
    with:
      apple_signing: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || inputs.apple_signing == true) }}
    secrets: inherit

  testflight:
    name: Upload verified iOS build to TestFlight
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || inputs.apple_signing == true)
    needs: [desktop, ios]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: ios-signed-ipa
          path: artifacts/ios-export
      - name: Upload with App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/upload-testflight.sh

  publish:
    name: Publish verified remote clients
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, ios, testflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          pattern: coop-bench-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          name: ios-xcode-project
          path: dist/ios
      - name: Verify version and all native installers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const version=JSON.parse(readFileSync('package.json')).version;
          if(process.env.GITHUB_REF_NAME!=='v'+version)throw Error('Tag/version mismatch');
          const files=['release','release-player'].flatMap(dir=>['win-x64.exe','mac-x64.dmg','mac-arm64.dmg','mac-x64.zip','mac-arm64.zip'].map(s=>[dir,`Coop-Bench-${dir==='release-player'?'Player-':''}${version}-${s}`]));
          files.push(['ios',`Coop-Bench-${version}-iOS-Xcode.zip`]);
          for(const [d,n] of files)if(!existsSync(`dist/${d}/${n}`))throw Error('Missing installer or iOS project '+n);
          writeFileSync('dist/release/SHA256SUMS.txt',files.map(([d,n])=>createHash('sha256').update(readFileSync(`dist/${d}/${n}`)).digest('hex')+'  '+n).join('\n')+'\n');
          NODE
      - name: Publish after all platform and package-boundary checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/*.exe dist/release/*.dmg dist/release/*.zip dist/release-player/*.exe dist/release-player/*.dmg dist/release-player/*.zip dist/ios/*.zip dist/release/SHA256SUMS.txt --verify-tag --title "Coop Bench ${GITHUB_REF_NAME#v}" --notes-file "docs/release-${GITHUB_REF_NAME#v}.md"
