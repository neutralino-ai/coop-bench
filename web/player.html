<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coop Bench Player</title><link rel="stylesheet" href="player.css"></head><body>
<header><div><strong>Coop Bench <span>Player</span></strong><small id="session-mode">本席参赛客户端</small></div><div id="connection" role="status" aria-live="polite"><i id="light" aria-hidden="true"></i><span id="status">正在启动…</span></div><button id="rules-button">游戏规则</button><button id="disconnect" hidden>断开</button></header>
<div id="progress" role="status" hidden><span class="spinner" aria-hidden="true"></span><span id="progress-text">正在启动…</span></div>
<main><section id="join"><h1>加入一场合作</h1><p>粘贴组织者提供的邀请链接。人类和 Agent 使用相同的规则与席位权限。</p><form id="join-form"><label>邀请链接<input id="invitation" required autocomplete="off" placeholder="coopbench://join#…"></label><label>Seat token<input id="seat-token" type="password" autocomplete="off" placeholder="输入房主发放的席位密钥"></label><label>玩家名字<input id="name" required maxlength="60" value="玩家"></label><label>由谁决策<select id="mode"><option value="human">我自己玩</option><option value="model">模型 API Agent</option></select></label><div id="model-config" hidden><label>API Base URL<input id="base-url" type="url" placeholder="https://provider.example/v1"></label><label>模型名称<input id="model" autocomplete="off"></label><label>API Key<input id="api-key" type="password" autocomplete="off"></label><p>密钥仅在本机本次进程使用。实际模型请求、响应与工具记录会上传供审计。</p></div><div class="buttons"><button id="join-button" type="submit">加入房间</button><button id="resume" type="button">恢复上次席位</button></div></form></section>
<section id="lobby" hidden><h1 id="game-name"></h1><p id="room-status"></p><div id="members"></div><div class="buttons"><button id="ready">准备好了</button><button id="start">开始游戏</button><button id="invite">复制新邀请链接</button></div></section>
<section id="game" hidden>
 <div class="game-heading"><h1 id="phase">游戏中</h1></div><p id="outcome" hidden></p>
   <section id="turn-panel" class="turn-panel" aria-labelledby="turn-label">
    <h2 id="turn-label" role="status" aria-live="polite">等待对局开始</h2>
    <strong id="deadline" role="timer" aria-live="off"></strong>
    <p id="timeout-policy" class="timeout-policy"></p>
   </section>
 <section id="recent-history-panel" class="recent-history-panel" aria-labelledby="recent-history-title">
  <div class="history-heading"><h2 id="recent-history-title">本轮动作</h2><span id="recent-history-scope">自你上次行动后</span></div>
  <p id="recent-history-status"></p><ol id="recent-action-history" class="action-history" aria-label="自我上次行动后的动作"></ol>
 </section>
 <div class="play-grid">
  <section class="board-panel"><h2>本席可见局面</h2><div id="board"></div></section>
  <section>
   <details class="history-panel" id="history-panel" open><summary>动作历史 <span id="history-count"></span></summary><p id="history-status"></p><ol id="action-history" class="action-history" aria-label="本席收到的全部动作历史"></ol></details>
   <form id="action-form" hidden><label>动作<select id="action-type"></select></label><p id="action-description"></p><div id="action-fields"></div><button id="act" type="submit">提交动作</button></form>
  </section>
 </div>
</section><p id="notice" role="status"></p></main>
<dialog id="history-event-dialog" aria-labelledby="history-event-title"><button id="close-history-event">关闭</button><h2 id="history-event-title">动作详情</h2><p id="history-event-text"></p><small id="history-event-time"></small></dialog>
<dialog id="rules-dialog"><button id="close-rules">关闭</button><h2>规则与实现范围</h2><div id="rules-content"></div></dialog><script src="player.js"></script></body></html>
